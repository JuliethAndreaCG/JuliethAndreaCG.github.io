name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow one concurrent deployment, queueing new runs after the current
# one finishes. Do NOT cancel in-progress runs — that can leave the
# site in an inconsistent state.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: write

# Strategy
# --------
# Force-add the built dist/ contents to the root of the main branch
# and push. GitHub Pages is configured to serve from main, so this
# makes the production build live without any UI configuration.
#
# Why this approach (and not peaceiris/actions-gh-pages or
# actions/deploy-pages)
#   peaceiris pushes to a gh-pages branch that Pages is not configured
#   to serve from (the legacy branch source is `main`, not `gh-pages`),
#   so those deploys are ignored.
#
#   actions/deploy-pages requires Pages to be on build_type=workflow,
#   but migrating from build_type=legacy (the current state) cannot
#   be done via the API — GITHUB_TOKEN returns 403 — only via the
#   Settings -> Pages UI. This workflow side-steps that constraint
#   entirely by committing the build output directly to main.
#
# Trade-offs (be aware)
#   1. The build output is committed to the repo. The repo grows
#      by ~1 MB per deploy.
#   2. The root index.html is overwritten with the BUILT version on
#      every deploy. Local `npm run dev` will look for a Vite dev
#      template; after the first deploy of this workflow you will
#      need to restore the dev template from git history:
#        git checkout HEAD~1 -- index.html
#      or set up a separate dev branch. The SW (sw.js) is preserved
#      because it lives in dist/ and gets re-committed with the same
#      content.
#   3. The [skip ci] tag in the commit message prevents the
#      workflow from re-running on its own push, which would loop.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore Vite dev template
        # After a previous deploy of this workflow, the root index.html
        # is the BUILT version (references /assets/index-*.js) which
        # Vite cannot use as input on subsequent builds. The canonical
        # dev template lives at index.html.dev and is the source of
        # truth that Vite needs at index.html before each build.
        run: cp -f index.html.dev index.html

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Flatten build output to repo root
        # GitHub Pages serves files at their actual path in the source
        # branch. The site references /og-banner.jpg, /sw.js, /assets/...
        # but those exist in the source tree under /public/ and /dist/.
        # Copy them to the branch root so Pages can serve them at the
        # URLs the site expects. The dev template (index.html.dev) is
        # left untouched so subsequent builds still work.
        run: |
          # Built HTML becomes the root index.html (Pages serves / from here).
          cp dist/index.html index.html
          # Built bundles (JS, CSS) live under /assets in dist/ — copy to root.
          mkdir -p assets
          cp -r dist/assets/. assets/
          # Static assets from public/ (og-banner.jpg, sw.js, manifest.json,
          # sitemap.xml, robots.txt, politica-de-privacidad.html, icons, etc.)
          # get copied to the branch root so /og-banner.jpg etc. resolve.
          cp -r public/. .

      - name: Force-deploy to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # -f overrides the .gitignore entries for dist/ and assets/.
          # We want the build output committed so GitHub Pages (which
          # serves from the main branch) can pick it up without any UI
          # toggle.
          git add -f index.html assets dist
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "ci: deploy build output to main [skip ci]"
            git push origin HEAD:main
          fi