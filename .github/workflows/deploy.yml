name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow one concurrent deployment, queueing new runs after the current
# one finishes. Do NOT cancel in-progress runs — that can leave the
# site in an inconsistent state.
concurrency:
  group: pages
  cancel-in-progress: false

# Required permissions for the official Pages deploy flow:
#   contents: read  -> checkout the repo
#   pages: write    -> deploy the artifact to Pages
#   id-token: write -> required by actions/configure-pages + actions/deploy-pages
permissions:
  contents: read
  pages: write
  id-token: write

# Strategy
# --------
# Use the official GitHub Actions Pages deploy flow instead of the old
# peaceiris/actions-gh-pages pattern. The configure-pages action can
# detect the repo's current configuration and migrate it to the
# "GitHub Actions" build type on its own, so no UI toggle is needed
# in Settings -> Pages even if the repo was previously serving from
# a branch.
#
# Steps
#   1. checkout, install, typecheck, build (standard CI).
#   2. actions/configure-pages -> idempotently enables the workflow
#      build_type. Safe to run on every push.
#   3. actions/upload-pages-artifact -> packages ./dist.
#   4. actions/deploy-pages -> publishes the artifact. Emits
#      steps.deployment.outputs.page_url for the summary step.
#
# Why this is better than committing dist/ to main
#   * The repo stays clean: build output is uploaded as a workflow
#     artifact, never committed.
#   * Local `npm run dev` keeps working — the root index.html stays
#     the Vite dev template.
#   * The Pages source becomes "GitHub Actions" automatically, so
#     future deploys are fully code-driven.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deployment summary
        if: steps.deployment.conclusion == 'success'
        run: |
          echo "::notice::Deployed to ${{ steps.deployment.outputs.page_url }}"
          echo "Page URL: ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"