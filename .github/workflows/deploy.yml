name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow one concurrent deployment, queueing new runs after the current
# one finishes. Do NOT cancel in-progress runs — that can leave the
# site in an inconsistent state.
concurrency:
  group: pages
  cancel-in-progress: false

# Required permissions for the official Pages deploy flow:
#   contents: read  -> checkout the repo
#   pages: write    -> migrate build_type + deploy the artifact
#   id-token: write -> required by actions/configure-pages + actions/deploy-pages
permissions:
  contents: read
  pages: write
  id-token: write

# Strategy
# --------
# Use the official GitHub Actions Pages deploy flow. The deploy flow
# requires Pages to be configured with build_type = "workflow". The
# repo was originally on build_type = "legacy" (serving from a
# branch), so this workflow first migrates the build_type via the
# GitHub API and then runs the deploy steps.
#
# Migration happens idempotently: PUT /repos/{owner}/{repo}/pages with
# build_type=workflow. If the repo is already on workflow build_type
# the PUT is a no-op (the API accepts the same body either way).
#
# Steps
#   1. checkout, install, typecheck, build.
#   2. Migrate Pages to workflow build_type (idempotent).
#   3. actions/configure-pages -> idempotently confirms the config.
#   4. actions/upload-pages-artifact -> packages ./dist.
#   5. actions/deploy-pages -> publishes the artifact. Emits
#      steps.deployment.outputs.page_url for the summary step.
#
# Why this is better than committing dist/ to main
#   * The repo stays clean: build output is uploaded as a workflow
#     artifact, never committed.
#   * Local `npm run dev` keeps working — the root index.html stays
#     the Vite dev template.
#   * The Pages source becomes "GitHub Actions" automatically, so
#     future deploys are fully code-driven.
jobs:
  build:
    runs-on: ubuntu-latest
    # Required by actions/deploy-pages — the job MUST declare the
    # github-pages environment or the Pages deployment API call
    # returns 400 "Missing environment".
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Migrate Pages to workflow build type
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          echo "Checking current Pages config for ${REPO}..."
          current=$(gh api "/repos/${REPO}/pages" --jq '.build_type')
          echo "Current build_type: ${current}"
          if [ "$current" = "workflow" ]; then
            echo "Already on workflow build_type, skipping migration."
          else
            echo "Migrating build_type from '${current}' to 'workflow'..."
            gh api \
              --method PUT \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/${REPO}/pages" \
              -f "build_type=workflow"
            echo "Migration complete."
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deployment summary
        if: steps.deployment.conclusion == 'success'
        run: |
          echo "::notice::Deployed to ${{ steps.deployment.outputs.page_url }}"
          echo "Page URL: ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"