name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow one concurrent deployment, queueing new runs after the current
# one finishes. Do NOT cancel in-progress runs — that can leave the
# site in an inconsistent state.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: write

# Strategy
# --------
# Force-add the built dist/ contents to the root of the main branch
# and push. GitHub Pages is configured to serve from main, so this
# makes the production build live without any UI configuration.
#
# Why this approach (and not peaceiris/actions-gh-pages or
# actions/deploy-pages)
#   peaceiris pushes to a gh-pages branch that Pages is not configured
#   to serve from (the legacy branch source is `main`, not `gh-pages`),
#   so those deploys are ignored.
#
#   actions/deploy-pages requires Pages to be on build_type=workflow,
#   but migrating from build_type=legacy (the current state) cannot
#   be done via the API — GITHUB_TOKEN returns 403 — only via the
#   Settings -> Pages UI. This workflow side-steps that constraint
#   entirely by committing the build output directly to main.
#
# Trade-offs (be aware)
#   1. The build output is committed to the repo. The repo grows
#      by ~1 MB per deploy.
#   2. The root index.html is overwritten with the BUILT version on
#      every deploy. Local `npm run dev` will look for a Vite dev
#      template; after the first deploy of this workflow you will
#      need to restore the dev template from git history:
#        git checkout HEAD~1 -- index.html
#      or set up a separate dev branch. The SW (sw.js) is preserved
#      because it lives in dist/ and gets re-committed with the same
#      content.
#   3. The [skip ci] tag in the commit message prevents the
#      workflow from re-running on its own push, which would loop.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Overwrite root index.html with the built version
        # Pages serves / from the root of the main branch. The root
        # index.html is the Vite dev template (references /src/main.tsx
        # which does not exist in production), so we replace it with
        # the built index.html that references /assets/index-*.js (which
        # we will commit in the next step). After the first deploy,
        # `npm run dev` locally breaks because the dev template is gone;
        # restore it with `git checkout HEAD~1 -- index.html`.
        run: cp dist/index.html index.html

      - name: Force-deploy dist/ to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # -f overrides the dist/ entry in .gitignore. We want the
          # build output committed so GitHub Pages (which serves from
          # the main branch) can pick it up without any UI toggle.
          git add -f dist
          # The root index.html was overwritten with the built version
          # in the previous step. Stage it explicitly (it is already
          # tracked so -f is not strictly required, but be defensive).
          git add -f index.html
          if git diff --cached --quiet; then
            echo "No dist changes to commit"
          else
            git commit -m "ci: deploy build output to main [skip ci]"
            git push origin HEAD:main
          fi